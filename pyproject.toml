[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jantama"
version = "0.1.0"
description = "雀魂の牌譜を解析し、なぜその打牌が良いのかを自然言語で説明するツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "mahjong>=1.2",
]

[project.optional-dependencies]
bot = ["discord.py>=2.3"]
dev = ["pytest>=8.0"]

[project.scripts]
jantama = "jantama.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
